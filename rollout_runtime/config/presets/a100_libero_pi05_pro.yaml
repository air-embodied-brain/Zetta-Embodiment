# 8×A100 上的 LIBERO-PRO 延时测试 preset。
#
# 从 a100_libero_pi05.yaml 复制而来，三处改动：
#   1. env_config.libero_variant: standard -> pro
#   2. env_config.task_id: 3 -> 由 run_ab_runtime.py 的 manifest 逐 episode 用
#      --task/--seed 覆盖，这里保留一个占位值。
#   3. env_config.return_all_frames: false -> true —— 正常 agent 回合会开录像
#      （工具链要出 episode.mp4 / episode_wrist.mp4 / episode_multiview.mp4），
#      legacy 在录像开启时走的就是 chunk_step(return_all_frames=True)；rollout
#      臂要复现同一条语义，seam 才不会在真实回合里直接 INVALID_ARGUMENT
#      （tests/runtime/test_zetta_seam.py、runtime validation notes §6.8/§7 与
#      zetta_libero_pi05.yaml 的先例）。a100_libero_pi05.yaml 保持 false 是因为它
#      本来就不是给完整 agent 回合用的吞吐扫描 preset；本次是端到端延时测试，
#      跑的是真实 zetta episode，必须打开。
#
# 约束（rollout_runtime/backends/rlinf_env.py 的 build()）：LIBERO-PRO/PLUS 不支持
# core_form=lockstep_vector（向量环境无法单独停一条 lane，PRO/PLUS 在任务终止后再
# step 会抛错）。本文件不写 core_form，落到家族默认值 per_slot，这正是 PRO 唯一
# 支持的形态，不需要额外声明。
#
# 权重：https://huggingface.co/RLinf/RLinf-Pi05-LIBERO-SFT
# 用 RR_PI05_MODEL_PATH 覆盖 model_path，避免把机器路径写进仓库。

env_family: libero
env_config:
  task_suite_name: libero_10
  task_id: 0
  # rlinf 官方 libero_10 评测参考下限（third_party/rlinf/docs/.../libero.rst
  # 《各套件 max_episode_steps 参考值》表；与 LIBERO-PRO 官方仓库
  # run_libero_eval.py 的 TASK_MAX_STEPS[LIBERO_10_*] = 520 一致）。
  # CLI 侧 --max-episode-steps 520 会覆盖这里，但两处保持一致避免歧义。
  max_episode_steps: 520
  camera_height: 256
  camera_width: 256
  camera_depths: true
  num_steps_wait: 15
  action_dim: 7
  # 动作块长度，必须与 policy_config.num_action_chunks 相等，且与 legacy 臂逐字相同。
  chunk_size: 5
  action_model_type: openpi
  # 见文件头注释 3：正常 agent 回合开录像，legacy 走 chunk_step(return_all_frames=True)。
  return_all_frames: true
  # 相对于 a100_libero_pi05.yaml 的实质改动：standard -> pro。
  libero_variant: pro

cluster:
  num_nodes: 1
  component_placement:
    rollout:
      placement: "0-7"

gateway:
  gateway_epoch: 1
  maintenance_interval_seconds: 1.0
  default_lease_seconds: 1800.0
  error_retention_seconds: 300.0
  result_ttl_seconds: 300.0
  heartbeat_timeout_seconds: 60.0
  max_concurrency_per_rank: 32
  metrics_namespace: rr

transport:
  kind: ray_channel
  command_queue_size: 256
  control_queue_size: 32
  result_queue_size: 512
  infer_request_queue_size: 256
  infer_response_queue_size: 256
  command_timeout_seconds: 600.0

env_worker:
  group_name: env
  num_ranks: 8
  placement_strategy: node
  max_sessions_per_rank: 2
  default_pool_size: 1
  seed_offset: 0

rollout_worker:
  group_name: rollout
  num_ranks: 8
  placement_strategy: packed
  tensor_parallel_size: 1
  pipeline_parallel_size: 1
  policy_id: pi05
  policy_family: openpi
  policy_backend: zetta_openpi
  device: cuda
  dtype: bfloat16
  max_concurrent_inferences: 32
  policy_config:
    model_type: openpi
    model_path: /path/to/checkpoints/RLinf-Pi05-LIBERO-SFT
    precision: null
    num_action_chunks: 5
    action_dim: 7
    num_steps: 5
    use_proprio: true
    add_value_head: false
    default_mode: eval
    model_version: pi05-libero-sft
    enable_cuda_graph: false
    cuda_graph_batch_size: null
    enable_torch_compile: false
    family_params:
      config_name: pi05_libero
      num_images_in_input: 2
      noise_level: 0.5
      train_expert_only: true
      noise_method: flow_sde
      value_after_vlm: false
      value_vlm_mode: mean_token
      detach_critic_input: null
      use_dsrl: false
  scheduler:
    max_batch_size: 8
    max_wait_ms: 20.0
    max_queue_depth: 256
    max_inflight_per_application: 128
    max_inflight_per_session: 1
    fixed_batch_size: null

admission:
  require_auth: false
  tokens: {}
  max_sessions_per_application: 64
  max_inflight_operations_per_application: 256
  max_inflight_operations_per_session: 2
  max_total_inflight_operations: 512

payload:
  inline_threshold_bytes: 262144
  request_limit_bytes: 8388608
  image_codec: png
