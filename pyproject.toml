[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "zetta"
version = "0.0.0"
authors = [{ name = "Zetta Contributors" }]
description = "Embodied agent framework for coordinating high-level reasoning and robot skills"
readme = {file = "README.md", content-type = "text/markdown"}
requires-python = ">=3.10,<3.13"
license = {file = "LICENSE"}
keywords = [
    "embodied-intelligence",
    "large-language-models",
    "agent-framework",
]
classifiers = [
    #   2 - Pre-Alpha
    #   3 - Alpha
    #   4 - Beta
    #   5 - Production/Stable
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: GPU :: NVIDIA CUDA :: 12 :: 12.4",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
]

dependencies = [
    "pydantic-ai-slim[anthropic,openai]>=2.1",
    "pydantic>=2",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "httpx>=0.27",
    "msgpack>=1.0",
    "mcp>=1.27,<2",
    "claude-agent-sdk>=0.1.60",
    "openai-codex>=0.1.0b3; python_version >= '3.11'",
    "huggingface_hub>=0.24",
    "prompt-toolkit>=3.0.48",
    "numpy",
    "imageio>=2.0",
]

[project.scripts]
zetta = "zetta.cli.main:main"
zetta-evolve = "zetta.evolution.cli:main"

[project.urls]
Homepage = "https://github.com/air-embodied-brain/Zetta-Embodiment"
Repository = "https://github.com/air-embodied-brain/Zetta-Embodiment"
Documentation = "https://github.com/air-embodied-brain/Zetta-Embodiment/tree/main/docs"
"Bug Report" = "https://github.com/air-embodied-brain/Zetta-Embodiment/issues"

[project.optional-dependencies]
test = [
    "pytest>=8,<10",
    "pytest-asyncio>=0.24,<2",
    "omegaconf>=2.3,<3",
    "imageio-ffmpeg>=0.5,<1",
    "scipy>=1.10,<2",
    "zetta[runtime]",
]
runtime = [
    "gym==0.26.2",
    "gymnasium>=1.1,<2",
    "prometheus-client>=0.20,<1",
    "torch>=2.4,<3",
]
ray = [
    "ray",
    "omegaconf>=2.3,<3",
]
openpi = [
    "rlinf-openpi",
]
cosmos-lite = [
    "websockets>=11,<17",
]
libero = []
# Simulator distributions are intentionally not declared here: liberopro and
# liberoplus publish transitive dependencies on the main RLinf framework. The
# deployment script installs the simulator with --no-deps and lists its
# supported runtime dependencies explicitly.
libero-pro = []
libero-plus = []
full = [
    "zetta[runtime,ray,openpi,libero-pro,sam3,cosmos-lite]",
]
sam3 = [
    "sam3==0.1.4",
    "torch",
    "torchvision",
    "pillow>=10",
]

[tool.uv]
prerelease = "allow"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "remote: requires a configured GPU host (real env / VLA backends)",
    "ray: needs a local Ray cluster (rollout runtime data plane)",
    "ray_launch: launches Zetta worker groups in separate Ray processes (slow)",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["zetta*", "robots*", "rollout_runtime*"]
exclude = ["tests*", "docs*", "examples*", "docker*", "toolkits*"]

[tool.setuptools.package-data]
"rollout_runtime.config" = ["presets/*.yaml"]

[tool.ruff]
line-length = 88
indent-width = 4
target-version = "py311"

[tool.ruff.lint]
isort = {known-first-party = ["zetta", "robots", "rollout_runtime"]}
select = ["C", "E", "F", "I", "W", "CPY001", "RUF013", "UP006", "PERF102", "PLC1802", "PLC0208", "DOC102", "DOC202", "DOC403", "DOC502"]
ignore = [
    "C901", # "complex-structure"
    "E501", # "line-too-long"
    "E741", # "ambiguous-variable-name"
    "D100", # "Missing docstring in public module"
    "D104", # "Missing docstring in public package"
    "D203", # "incorrect-blank-line-before-class", conflict with D211,
    "D213", # "multi-line-summary-second-line", conflict with D212
]
fixable = ["ALL"]
unfixable = []

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = true
docstring-code-line-length = "dynamic"
